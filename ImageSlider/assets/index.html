<style>
html,body{position:absolute;inset:0;margin:0;padding:0;overflow:hidden}*{box-sizing:border-box}
#image-slider{position:absolute;inset:0;overflow:hidden;outline:none;user-select:none;-webkit-user-select:none;background:transparent}
.slider-image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:center;pointer-events:none;-webkit-user-drag:none}
#slider-image-back{z-index:0}#slider-image-front{z-index:1}
.slider-button{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;font-size:30px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 3px;z-index:4}
.slider-button:disabled{display:none}#previous-button{left:10px}#next-button{right:10px}
#slider-counter{position:absolute;right:10px;bottom:10px;min-width:52px;padding:5px 10px;border-radius:14px;background:rgba(0,0,0,.48);color:#fff;font-family:Poppins,sans-serif;font-size:13px;line-height:18px;text-align:center;z-index:4}
#slider-text{position:absolute;left:10px;right:72px;bottom:10px;max-width:calc(100% - 92px);padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.48);color:#fff;font-family:Poppins,sans-serif;z-index:4}
#slider-title{font-size:14px;line-height:19px;font-weight:600}#slider-description{margin-top:2px;font-size:12px;line-height:17px;font-weight:400}
#slider-empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;font-family:Poppins,sans-serif;font-size:14px;text-align:center;opacity:.65;z-index:3}
.fade-in{animation-name:image-slider-fade-in;animation-timing-function:ease;animation-fill-mode:both}
.slide-in-right{animation-name:image-slider-slide-in-right;animation-timing-function:ease;animation-fill-mode:both}
.slide-in-left{animation-name:image-slider-slide-in-left;animation-timing-function:ease;animation-fill-mode:both}
@keyframes image-slider-fade-in{from{opacity:0}to{opacity:1}}
@keyframes image-slider-slide-in-right{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes image-slider-slide-in-left{from{transform:translateX(-100%)}to{transform:translateX(0)}}
</style>
<div id="image-slider" tabindex="0" aria-label="Image gallery">
<img id="slider-image-back" class="slider-image" alt="">
<img id="slider-image-front" class="slider-image" alt="">
<button id="previous-button" class="slider-button" type="button">‹</button>
<button id="next-button" class="slider-button" type="button">›</button>
<div id="slider-text"><div id="slider-title"></div><div id="slider-description"></div></div>
<div id="slider-counter"></div><div id="slider-empty">No images available</div>
</div>
<script>
const slider=document.getElementById('image-slider'),imageBack=document.getElementById('slider-image-back'),imageFront=document.getElementById('slider-image-front'),previousButton=document.getElementById('previous-button'),nextButton=document.getElementById('next-button'),counter=document.getElementById('slider-counter'),textBox=document.getElementById('slider-text'),title=document.getElementById('slider-title'),description=document.getElementById('slider-description'),emptyState=document.getElementById('slider-empty');
let currentIndex=0,imageCount=0,currentImage='',currentAlbum='',transition='Fade',transitionDuration=300,animationTimer=null;
function handleMessage(message){let data=message;if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){console.error(e);return}}if(!data||typeof data!=='object')return;if(typeof data.emptyText==='string')emptyState.textContent=data.emptyText;if(typeof data.ariaLabel==='string')slider.setAttribute('aria-label',data.ariaLabel);const oldIndex=currentIndex,oldCount=imageCount,oldAlbum=currentAlbum;imageCount=Number(data.count)||0;currentIndex=Number(data.index)||0;currentAlbum=typeof data.album==='string'?data.album:'';transition=['None','Fade','Slide'].includes(data.transition)?data.transition:'Fade';transitionDuration=Math.max(0,Math.min(5000,Number(data.transitionDuration)||0));if(imageCount<=0||!data.image){showEmptyState();return}let direction=1;if(oldAlbum===currentAlbum&&oldCount===imageCount){if(oldIndex===imageCount-1&&currentIndex===0)direction=1;else if(oldIndex===0&&currentIndex===imageCount-1)direction=-1;else if(currentIndex<oldIndex)direction=-1}showImageData(data,direction)}
function showImageData(data,direction){clearAnimation();imageFront.style.display='block';imageBack.style.display='block';imageBack.src=currentImage||data.image;imageFront.src=data.image;imageFront.className='slider-image';imageFront.style.animationDuration=`${transitionDuration}ms`;const changed=currentImage!==''&&currentImage!==data.image;const animate=changed&&transitionDuration>0&&transition!=='None';if(animate){if(transition==='Fade')imageFront.classList.add('fade-in');else if(transition==='Slide')imageFront.classList.add(direction<0?'slide-in-left':'slide-in-right');animationTimer=setTimeout(finishAnimation,transitionDuration+50)}else finishAnimation();currentImage=data.image;emptyState.style.display='none';updateText(data.title||'',data.description||'');counter.textContent=`${currentIndex+1} / ${imageCount}`;counter.style.display=imageCount>1?'block':'none';previousButton.disabled=nextButton.disabled=imageCount<=1}
function finishAnimation(){clearAnimation();imageBack.src=currentImage;imageFront.className='slider-image'}
function clearAnimation(){if(animationTimer!==null){clearTimeout(animationTimer);animationTimer=null}}
function updateText(t,d){title.textContent=t;description.textContent=d;title.style.display=t!==''?'block':'none';description.style.display=d!==''?'block':'none';textBox.style.display=(t!==''||d!=='')?'block':'none'}
function showEmptyState(){clearAnimation();currentImage='';imageBack.removeAttribute('src');imageFront.removeAttribute('src');imageBack.style.display='none';imageFront.style.display='none';emptyState.style.display='flex';counter.style.display='none';updateText('','');previousButton.disabled=nextButton.disabled=true}
function showImage(i){if(imageCount<=0)return;requestAction('ShowImage',((i%imageCount)+imageCount)%imageCount)}
function nextImage(){showImage(currentIndex+1)}function previousImage(){showImage(currentIndex-1)}
previousButton.addEventListener('click',previousImage);nextButton.addEventListener('click',nextImage);
slider.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();previousImage()}if(e.key==='ArrowRight'){e.preventDefault();nextImage()}});
</script>
